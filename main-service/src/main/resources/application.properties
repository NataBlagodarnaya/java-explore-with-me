server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.mandatory-file-encoding=UTF-8

spring.application.name=main-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ewm-main}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:practicum}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:practicum}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

stats-server.url=${STATS_SERVER_URL:http://localhost:9090}